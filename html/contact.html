<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
　　<link rel="stylesheet" href="../style.css">
　　<script src="../script.js"></script>


    <title>ほころび official saite -CONTACT</title>
  </head>

  <body>
    <!-- 共通ヘッダー -->
    <div class="live-sticky-header-wrap visible">
      <header class="site-header-common">
        <h1 class="logo-common">
          <a href="../index.html"
            ><img src="../img/log.img/hiragana.log.png" alt="ほころび"
          /></a>
        </h1>
        <nav class="header-nav-common">
          <ul>
            <li><a href="store.html">STORE</a></li>
          <li><a href="live.html">LIVE</a></li>
          <li><a href="plofile.html">PROFILE</a></li>
          <li><a href="contact.html">CONTACT</a></li>
          </ul>
        </nav>
      </header>
    </div>

    <div class="live-sticky-title-wrap">

      <div class="page-title-area">
        <span class="sub-title">ほころび</span>
        <h2 class="main-title">CONTACT</h2>
      </div>
    </div>

    <main class="contact-page-main">
      <div class="contact-form-container">
        <form action="#" method="post" class="contact-form">
          <div class="form-group">
            <label for="subject" class="foem-label">件名</label>
            <div class="select-wrapper">
              <select
                name="subject"
                id="subject"
                class="form-input form-select"
              >
                <option value="disabled selected">選択</option>
                <option value="ticket">チケットについて</option>
                <option value="goods">グッズについて</option>
                <option value="media">出演・お仕事のご依頼</option>
                <option value="other">その他・お問い合わせ</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">お名前</label>
            <div class="name-inputs-flex">
              <div class="name-input-wrap">
                <input
                  type="text"
                  name="last-name"
                  class="form-input"
                  placeholder="姓"
                />
              </div>
              <div class="name-input-wrap">
                <input
                  type="text"
                  name="first-name"
                  class="form-input"
                  placeholder="名"
                />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="email" class="form-label">メールアドレス</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="選択"
            />
          </div>

          <div class="form-group">
            <label for="message" class="form-label">メッセージ</label>
            <textarea
              id="message"
              name="message"
              class="form-input form-textarea"
              rows="6"
            ></textarea>
          </div>

          <div class="form-submit-area">
            <button type="submit" class="form-submit-btn">送信する</button>
          </div>


        </form>
      </div>
    </main>

    <footer class="site-footer" data-bg="#ffffff">
      <div class="footer-container">
        <nav class="footer-nav">
          <ul>
            <li><a href="store.html">STORE</a></li>
            <li><a href="live.html">LIVE</a></li>
            <li><a href="plofile.html">PROFILE</a></li>
            <li><a href="contact.html">CINTACT</a></li>
          </ul>
        </nav>

        <div class="footer-logo">
          <a href="../html/index.html"><img src="../img/log.img/hiragana.log.png" alt="" /></a>
        </div>

        <div class="footer-sns">
          <a href="#"
            ><img src="../img/log.img/apple music.png" alt="Apple music"
          /></a>
          <a href="#"><img src="../img/log.img/Spotify.png" alt="Spotify" /></a>
          <a href="#"
            ><img src="../img/log.img/insta.png" alt="インスタグラム"
          /></a>
          <a href="#"><img src="../img/log.img/YouTube.png" alt="YouTube" /></a>
        </div>
      </div>

      <div class="footer-bottom">
        <div class="footer-copylight">
          <a href="#">利用規約</a>
          <a href="#">Privacy policy</a>
          <a href="#">Cookie settings</a>
          <span>© 2026 hokorobi</span>
        </div>
      </div>
    </footer>

    <script src="script.js" defer></script>
  </body>
</html>
